[project]
name = "llm-coding-performance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ariel", email = "alvzariel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "pandas>=3.1.0",
    "safetensors>=0.8.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
llm-coding-performance = "llm_coding_performance:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
